
name: pollosarica
description: "Aplicación móvil de Pollos Arica."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.4
  gallery_saver_plus: ^3.2.9
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_pollos_arica.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_pollos_arica.png"
  adaptive_icon_background: "#FFF4E5"
  adaptive_icon_foreground: "assets/images/logo_pollos_arica.png"
  min_sdk_android: 21
